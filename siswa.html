<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Siswa - SD NEGERI 62 TAJONG</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background: #f0f7ff url('sekolahku.jpg.jpeg') no-repeat center center fixed;
            background-size: cover;
            background-blend-mode: soft-light;
            background-color: #eef5ff;
            min-height: 100vh;
            padding: 15px;
        }

        header {
            background: rgba(26, 82, 150, 0.95);
            backdrop-filter: blur(5px);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .user-info h3 { font-size: 14px; letter-spacing: 0.5px; opacity: 0.9; }
        .user-info p { font-size: 16px; font-weight: 700; color: #ffbc00; }

        .btn-logout {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
            border: 1.5px solid #ff4757;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: 0.3s;
        }
        .btn-logout:hover { background: #ff4757; color: white; }

        /* --- Papan Pengumuman Baru --- */
        .announcement-container {
            max-width: 900px;
            margin: 0 auto 20px;
        }
        .announcement-card {
            background: white;
            padding: 15px;
            border-radius: 20px;
            border-left: 5px solid #ffbc00;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: none; /* Sembunyi jika tidak ada pengumuman */
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .announcement-card h4 { color: #1a5296; font-size: 14px; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .announcement-card p { font-size: 13px; color: #555; line-height: 1.4; }
        .announcement-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; margin-top: 10px; }
        .announcement-time { font-size: 10px; color: #aaa; margin-top: 10px; display: block; }

        /* Container Grid Menu */
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: 0.3s;
            border: 2px solid white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .card:hover { transform: translateY(-5px); border-color: #1a5296; background: white; }
        
        .card-icon { 
            font-size: 30px; 
            margin-bottom: 8px; 
            background: #f0f7ff;
            width: 55px;
            height: 55px;
            line-height: 55px;
            border-radius: 50%;
        }
        
        .card h2 { color: #1a5296; font-size: 13px; font-weight: 700; margin-bottom: 2px; }
        .card p { color: #888; font-size: 9px; margin-bottom: 12px; }

        .btn-link {
            text-decoration: none; color: white; padding: 7px; border-radius: 10px;
            font-weight: 700; font-size: 10px; border: none; width: 100%; cursor: pointer;
        }

        .blue { background: linear-gradient(135deg, #1e90ff, #1a5296); }
        .orange { background: linear-gradient(135deg, #ffa500, #ff8c00); }
        .green { background: linear-gradient(135deg, #2ed573, #26af5a); }
        .purple { background: linear-gradient(135deg, #a55eea, #8854d0); }
        .light-blue { background: linear-gradient(135deg, #70a1ff, #5352ed); }

        @media (min-width: 600px) {
            .container { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <h3>PORTAL SISWA 🎓</h3>
            <p id="tampilNama">Memuat...</p>
        </div>
        <button class="btn-logout" onclick="aksiLogout()">Keluar ✖</button>
    </header>

    <div class="announcement-container">
        <div id="papanInfo" class="announcement-card">
            <h4 id="infoType">📢 Pengumuman</h4>
            <strong id="infoTitle" style="font-size: 15px; color: #333;"></strong>
            <p id="infoContent"></p>
            <img id="infoImage" src="" class="announcement-img" style="display:none;">
            <span id="infoTime" class="announcement-time"></span>
        </div>
    </div>

    <div class="container">
        <div class="card" onclick="location.href='kelas-digital.html'">
            <div class="card-icon">💻</div>
            <h2>Kelas Digital</h2>
            <p>Materi & Tugas</p>
            <button class="btn-link blue">BUKA</button>
        </div>

        <div class="card" onclick="location.href='https://sunbio-bio.github.io/monitoring-siswa/'">
            <div class="card-icon">🧠</div>
            <h2>Asah Otak</h2>
            <p>Kuis Interaktif</p>
            <button class="btn-link orange">MAIN</button>
        </div>

        <div class="card" onclick="location.href='jadwal-kebersihan.html'">
            <div class="card-icon">🧹</div>
            <h2>Jadwal Piket</h2>
            <p>Harian Siswa</p>
            <button class="btn-link purple">CEK</button>
        </div>

        <div class="card" onclick="location.href='forum.html'">
            <div class="card-icon">💬</div>
            <h2>Forum</h2>
            <p>Tanya Jawab</p>
            <button class="btn-link light-blue">GABUNG</button>
        </div>

        <div class="card" onclick="alert('Fitur Bank Soal segera hadir!')">
            <div class="card-icon">📝</div>
            <h2>Bank Soal</h2>
            <p>Latihan Ujian</p>
            <button class="btn-link green">MULAI</button>
        </div>
    </div>

    <script>
        // 1. KONEKSI ABLY (Sama dengan Guru)
        const ably = new Ably.Realtime('Lqd-SA.02uOJw:5Q9fS13uwWhBLZJsqF9XA4gjNMzowZHCq2jJ9kxDdx8');
        const channel = ably.channels.get('update-sekolah');

        // 2. TAMPILKAN INFO SAAT ADA UPDATE DARI GURU
        channel.subscribe('infoBaru', function(message) {
            const data = message.data;
            
            // Simpan ke memori HP agar pengumuman tidak hilang saat di-refresh
            localStorage.setItem('last_announcement', JSON.stringify(data));
            
            tampilkanInfo(data);
        });

        function tampilkanInfo(data) {
            if(!data) return;

            document.getElementById('papanInfo').style.display = 'block';
            document.getElementById('infoType').innerText = data.tipe === 'PENGUMUMAN' ? '📢 Pengumuman Sekolah' : 
                                                            data.tipe === 'KEGIATAN' ? 'ℹ️ Info Kegiatan' : '⭐ Prestasi Siswa';
            document.getElementById('infoTitle').innerText = data.judul;
            document.getElementById('infoContent').innerText = data.isi;
            document.getElementById('infoTime').innerText = "Dikirim pada: " + data.tanggal;

            const imgTag = document.getElementById('infoImage');
            if(data.foto) {
                imgTag.src = data.foto;
                imgTag.style.display = 'block';
            } else {
                imgTag.style.display = 'none';
            }
        }

        // 3. LOGIKA LOGIN & NAMA
        function ambilNamaSiswa() {
            const data = localStorage.getItem('siswa') || localStorage.getItem('user') || sessionStorage.getItem('nama');
            if (data) {
                try {
                    const obj = JSON.parse(data);
                    return obj.nama || obj.user || data;
                } catch(e) { return data; }
            }
            return null;
        }

        window.onload = function() {
            const namaSiswa = ambilNamaSiswa();
            if (namaSiswa) {
                document.getElementById("tampilNama").innerText = namaSiswa;
            } else {
                window.location.href = "login.html";
            }

            // Cek apakah ada pengumuman terakhir yang tersimpan di memori
            const lastInfo = JSON.parse(localStorage.getItem('last_announcement'));
            if(lastInfo) tampilkanInfo(lastInfo);
        };

        function aksiLogout() {
            if(confirm("Yakin ingin keluar?")) {
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
