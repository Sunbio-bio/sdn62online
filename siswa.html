<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Siswa - SD NEGERI 62 TAJONG</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background: #f0f7ff url('sekolahku.jpg.jpeg') no-repeat center center fixed;
            background-size: cover;
            background-blend-mode: soft-light;
            background-color: #eef5ff;
            min-height: 100vh;
            padding: 15px;
        }

        /* Header yang lebih elegan */
        header {
            background: rgba(26, 82, 150, 0.95);
            backdrop-filter: blur(5px);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .user-info h3 { font-size: 14px; letter-spacing: 0.5px; opacity: 0.9; }
        .user-info p { font-size: 16px; font-weight: 700; color: #ffbc00; }

        .btn-logout {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
            border: 1.5px solid #ff4757;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: 0.3s;
        }
        .btn-logout:hover { background: #ff4757; color: white; }

        /* Container Grid yang lebih padat */
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 Kolom di HP agar ringkas */
            gap: 15px;
        }

        /* Card Menu dikecilkan */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: 0.3s;
            border: 2px solid white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .card:hover { transform: translateY(-5px); border-color: #1a5296; background: white; }
        
        /* Ikon & Teks yang lebih proporsional */
        .card-icon { 
            font-size: 35px; 
            margin-bottom: 8px; 
            background: #f0f7ff;
            width: 60px;
            height: 60px;
            line-height: 60px;
            border-radius: 50%;
        }
        
        .card h2 { color: #1a5296; font-size: 14px; font-weight: 700; margin-bottom: 2px; }
        .card p { color: #888; font-size: 10px; margin-bottom: 12px; line-height: 1.2; }

        /* Tombol Link yang disesuaikan */
        .btn-link {
            text-decoration: none;
            color: white;
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 11px;
            border: none;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .blue { background: linear-gradient(135deg, #1e90ff, #1a5296); }
        .orange { background: linear-gradient(135deg, #ffa500, #ff8c00); }
        .green { background: linear-gradient(135deg, #2ed573, #26af5a); }
        .purple { background: linear-gradient(135deg, #a55eea, #8854d0); }
        .light-blue { background: linear-gradient(135deg, #70a1ff, #5352ed); }

        /* Khusus Tablet/Laptop biar tetap bagus */
        @media (min-width: 600px) {
            .container { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <h3>PORTAL SISWA 🎓</h3>
            <p id="tampilNama">...</p>
        </div>
        <button class="btn-logout" onclick="aksiLogout()">Keluar ✖</button>
    </header>

    <div class="container">
        <div class="card" onclick="location.href='kelas-digital.html'">
            <div class="card-icon">💻</div>
            <h2>Kelas Digital</h2>
            <p>Materi & Tugas</p>
            <button class="btn-link blue">BUKA</button>
        </div>

        <div class="card" onclick="location.href='https://sunbio-bio.github.io/monitoring-siswa/'">
            <div class="card-icon">🧠</div>
            <h2>Asah Otak</h2>
            <p>Kuis Interaktif</p>
            <button class="btn-link orange">MAIN</button>
        </div>

        <div class="card" onclick="location.href='jadwal-kebersihan.html'">
            <div class="card-icon">🧹</div>
            <h2>Jadwal Piket</h2>
            <p>Harian Siswa</p>
            <button class="btn-link purple">CEK</button>
        </div>

        <div class="card" onclick="bukaForum()">
            <div class="card-icon">💬</div>
            <h2>Forum</h2>
            <p>Tanya Jawab</p>
            <button class="btn-link light-blue">GABUNG</button>
        </div>

        <div class="card" onclick="alert('Fitur Bank Soal segera hadir!')">
            <div class="card-icon">📝</div>
            <h2>Bank Soal</h2>
            <p>Latihan Ujian</p>
            <button class="btn-link green">MULAI</button>
        </div>
    </div>

    <script>
        const socket = io();

        function ambilNamaSiswa() {
            const data = localStorage.getItem('siswa') || localStorage.getItem('user') || sessionStorage.getItem('nama');
            if (data) {
                try {
                    const obj = JSON.parse(data);
                    return obj.nama || obj.user || data;
                } catch(e) { return data; }
            }
            return null;
        }

        const namaSiswa = ambilNamaSiswa();

        if (namaSiswa) {
            document.getElementById("tampilNama").innerText = namaSiswa;
            // Emit join_room tetap dipertahankan untuk monitoring Bapak
            socket.emit('join_room', { nama: namaSiswa, roomCode: "62" });
        } else {
            window.location.href = "login.html";
        }

        function bukaForum() {
            window.location.href = "forum.html"; 
        }

        function aksiLogout() {
            if(confirm("Yakin ingin keluar?")) {
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
