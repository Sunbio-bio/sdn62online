<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Piket - SDN 62 TAJONG</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f7fa; padding: 20px; }
        .box { background: white; max-width: 650px; margin: auto; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a5296; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: 600; color: #555; }
        select, input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        
        .btn-save { width: 100%; background: #27ae60; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .btn-copy { width: 100%; background: #1a5296; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        .code-output { background: #2d3436; color: #fab1a0; padding: 15px; border-radius: 8px; margin-top: 20px; font-family: monospace; font-size: 12px; display: none; overflow-x: auto; }
        .hari-item { background: #f9f9f9; padding: 10px; margin-bottom: 5px; border-radius: 8px; border-left: 5px solid #ff8c00; font-size: 14px; }
    </style>
</head>
<body>

<div class="box">
    <a href="index.html" style="text-decoration:none; color:#1a5296; font-size:14px;">❮ Kembali</a>
    <h2>🛠 Admin Jadwal Piket</h2>
    
    <p style="font-size: 12px; color: #666; background: #fff3cd; padding: 10px; border-radius: 5px;">
        <b>Info:</b> Karena kita menggunakan GitHub Gratis, data tidak bisa otomatis terkirim. Bapak harus copy kode di bawah dan tempel di GitHub.
    </p>

    <label>Pilih Hari:</label>
    <select id="pilihHari">
        <option value="Senin">Senin</option>
        <option value="Selasa">Selasa</option>
        <option value="Rabu">Rabu</option>
        <option value="Kamis">Kamis</option>
        <option value="Jumat">Jumat</option>
        <option value="Sabtu">Sabtu</option>
    </select>

    <label>Nama Siswa (Pisahkan dengan koma):</label>
    <input type="text" id="inputNama" placeholder="Contoh: Ahmad, Siti, Budi">

    <button onclick="tambahJadwal()" class="btn-save">➕ Tambah ke Daftar</button>

    <div id="preview" style="margin-top:20px;"></div>

    <button id="btnCopy" onclick="salinKode()" class="btn-copy" style="display:none;">📋 Salin Kode Jadwal Untuk GitHub</button>
    
    <textarea id="outputKode" class="code-output" readonly></textarea>
</div>

<script>
    let jadwalSekolah = {};

    function tambahJadwal() {
        const hari = document.getElementById('pilihHari').value;
        const nama = document.getElementById('inputNama').value;
        
        if(!nama) return alert("Isi nama dulu!");

        jadwalSekolah[hari] = nama.split(',').map(n => n.trim());
        renderPreview();
        buatKode();
    }

    function renderPreview() {
        const div = document.getElementById('preview');
        div.innerHTML = "<strong>Preview:</strong><br>";
        for (let hari in jadwalSekolah) {
            div.innerHTML += `<div class="hari-item"><b>${hari}:</b> ${jadwalSekolah[hari].join(', ')}</div>`;
        }
    }

    function buatKode() {
        const json = JSON.stringify(jadwalSekolah);
        const code = `const DATA_JADWAL = ${json};`;
        document.getElementById('outputKode').value = code;
        document.getElementById('outputKode').style.display = "block";
        document.getElementById('btnCopy').style.display = "block";
    }

    function salinKode() {
        const copyText = document.getElementById("outputKode");
        copyText.select();
        document.execCommand("copy");
        alert("Kode berhasil disalin! Sekarang tempelkan di file jadwal-kebersihan.html di GitHub Bapak.");
    }
</script>
</body>
</html>
