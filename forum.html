<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Diskusi - SDN 62 TAJONG</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #eef5ff; display: flex; flex-direction: column; height: 100vh; }
        
        header { 
            background: #1a5296; color: white; padding: 15px; 
            display: flex; align-items: center; gap: 10px;
            position: sticky; top: 0; z-index: 100;
        }
        header button { background: none; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 8px; cursor: pointer; }

        #chat-container { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 10px;
        }

        .bubble { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; position: relative; }
        .bubble .sender { font-size: 10px; font-weight: bold; display: block; margin-bottom: 3px; }
        
        /* Gaya Chat Siswa */
        .bubble.siswa { background: white; align-self: flex-start; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* Gaya Chat Guru */
        .bubble.guru { background: #1a5296; align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
        .bubble.guru .sender { color: #ffbc00; }

        .input-area { background: white; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        button#btnKirim { background: #1a5296; color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <button onclick="history.back()">⬅ Kembali</button>
        <div style="flex:1">
            <h4 style="font-size: 14px;">Forum Diskusi 💬</h4>
            <p style="font-size: 10px; opacity: 0.8;">SD NEGERI 62 TAJONG</p>
        </div>
    </header>

    <div id="chat-container">
        </div>

    <div class="input-area">
        <input type="text" id="pesanInput" placeholder="Ketik pesan..." onkeypress="cekEnter(event)">
        <button id="btnKirim" onclick="kirimPesan()">Kirim</button>
    </div>

    <script>
        const ably = new Ably.Realtime('Lqd-SA.02uOJw:5Q9fS13uwWhBLZJsqF9XA4gjNMzowZHCq2jJ9kxDdx8');
        const channel = ably.channels.get('forum-diskusi');

        // Ambil nama dari login (Siswa atau Guru)
        const urlParams = new URLSearchParams(window.location.search);
        const roleGuru = urlParams.get('user'); // Cek jika dari index.html guru
        
        const dataUser = JSON.parse(localStorage.getItem('siswa') || localStorage.getItem('user') || '{"nama":"Anonim"}');
        const namaUser = roleGuru ? "Bapak/Ibu Guru" : (dataUser.nama || dataUser.user || "Siswa");
        const tipeUser = roleGuru ? "guru" : "siswa";

        // Berlangganan pesan baru
        channel.subscribe('pesan', (message) => {
            tampilkanPesan(message.data);
        });

        function kirimPesan() {
            const input = document.getElementById('pesanInput');
            const teks = input.value.trim();
            
            if (teks === "") return;

            channel.publish('pesan', {
                nama: namaUser,
                isi: teks,
                tipe: tipeUser
            });

            input.value = "";
        }

        function tampilkanPesan(data) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `bubble ${data.tipe}`;
            div.innerHTML = `<span class="sender">${data.nama}</span> ${data.isi}`;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight; // Auto scroll ke bawah
        }

        function cekEnter(e) {
            if (e.key === 'Enter') kirimPesan();
        }
    </script>
</body>
</html>
